name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: install & smoke-test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # Proves the package pip-installs from a clean checkout with its structures +
      # dynamics extras (biopython / biotite / mdtraj / MDAnalysis / scikit-learn /
      # scipy / matplotlib / deeptime / anarcii all ship manylinux wheels). Heavy or
      # runner-provisioned stacks (torch, pymol, legacy anarci, modeller, ifscore)
      # are intentionally not installed here.
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[structures,dynamics,dev]"

      - name: Smoke tests
        run: pytest -q

      - name: CLI is wired
        run: kinapse info
