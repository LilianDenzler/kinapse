# Conda/mamba/micromamba environment for kinapse.
#
# Several scientific dependencies (biotite, ANARCI, PyMOL, ...) are most
# reliably installed from conda-forge / bioconda. Easiest: run ./setup.sh (it
# auto-detects conda/mamba/micromamba). By hand (swap `conda` for `micromamba`/
# `mamba` if that's your tool):
#
#     conda env create -f environment.yml
#     conda activate kinapse         # or: micromamba activate kinapse
#     pip install -e ".[all,dev]"
#
# Ported and extended from the original TCR_Metrics env.sh.
name: kinapse
channels:
  - conda-forge
  - bioconda
dependencies:
  - python=3.10
  - numpy
  - scipy
  - pandas
  - matplotlib
  - pyyaml
  - tqdm
  - scikit-learn
  - biopython
  - biotite
  - mdtraj
  - mdanalysis
  - deeptime
  # IMGT numbering
  - bioconda::anarci          # legacy ANARCI (default path in the TCR loader)
  # visualisation (optional; used by the PyMOL pipeline scripts)
  - pymol-open-source
  - pip
  - pip:
      # installs kinapse + its numbering (anarcii) and reduce (deeptime) extras.
      # add ,embed for the torch/Evoformer path (large — pulls torch).
      - -e ".[numbering,reduce,dev]"
# Not covered here (install separately if you need them):
#   * MODELLER  — licensed; `conda install -c salilab modeller` + license key
#                 (only needed for kinapse.structures.linkers)
#   * torch     — install the build matching your CUDA (only for kinapse.embedding)
#   * MMseqs2 (GPU) binary + an OpenFold checkout (kinapse.embedding Evoformer path)
#   * TMalign / ProFit binaries (optional alignment engines in kinapse.analysis)
#   * the external DiG diffusion model (kinapse.generation)
