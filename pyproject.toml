[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kinapse"
version = "0.1.0"
description = "Modular toolkit for TCR / TCR-pMHC structure prep, sequence embedding, geometry, MD/structure dynamics analysis, and conformer generation."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Lilian Denzler" }]
keywords = ["TCR", "immunology", "molecular-dynamics", "protein-structure", "IMGT", "pMHC"]

# Lightweight core — only what config / regions / runners and the light module
# surface need. Every heavy scientific dependency lives in a per-module extra
# below, so `pip install kinapse` stays tiny and you install just what you use.
dependencies = [
    "numpy",
    "pandas",
    "pyyaml",
    "tqdm",
]

[project.optional-dependencies]
# --- native science modules (one extra per module) ---
structures = ["biopython", "biotite", "mdtraj", "anarcii", "freesasa"]
sequence   = ["biopython"]
geometry   = ["biotite", "biopython", "MDAnalysis"]
dynamics   = ["mdtraj", "MDAnalysis", "scikit-learn", "scipy", "matplotlib", "deeptime"]
dynabind   = []
# --- runner tiers: thin shims here; the actual external tools are provisioned
#     per-tool in isolated envs via `uv` (see docs/ADDING_A_MODEL.md) ---
generation = ["mdtraj"]
modelling  = []
binding    = []
docking    = []
structure_analysis = []   # STCRpy etc. run in their own external env (KINAPSE_STCRPY_PYTHON)
scoring    = []   # interface scoring via the separate `ifscore` package (see docs/scoring.md)
# --- data / research ---
datasets   = []
bench      = ["scikit-learn", "scipy", "matplotlib"]
# --- misc / tooling ---
viz        = ["matplotlib"]
dev        = ["pytest", "ruff", "build"]
# --- back-compat aliases for older extra names ---
numbering  = ["anarcii"]
reduce     = ["deeptime"]
embed      = ["torch"]
# everything pip-installable at once
all = ["biopython", "biotite", "mdtraj", "MDAnalysis", "scikit-learn", "scipy",
       "matplotlib", "anarcii", "deeptime", "torch"]

[project.scripts]
kinapse = "kinapse.cli:main"

[project.urls]
Homepage = "https://example.com/kinapse"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"kinapse.data" = ["so3/*.npy"]
"kinapse.geometry" = ["data/**/*"]
"kinapse.structures.numbering" = ["README"]
"kinapse.pipelines.benchmark" = ["*.yaml"]
"kinapse.pipelines.best_method" = ["*.yml"]

[tool.setuptools]
include-package-data = true

[tool.pytest.ini_options]
# Only collect the real test suite — never the migrated pipeline modules
# (e.g. pipelines/best_method/run_test.py, which matches *_test.py).
testpaths = ["tests"]

[tool.ruff]
# The migrated science code predates linting; keep CI green by not gating on it.
extend-exclude = ["src/kinapse/pipelines", "src/kinapse/geometry/data"]
